  release-ca:
    name: Push to RubyGems (content-addressable)
    needs: [build-native-darwin-ca, build-native-linux-ca, build-native-linux-arm-ca, build-native-musl-x86_64-ca, build-native-musl-aarch64-ca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gem-ca-*
          merge-multiple: true
          path: pkg/
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push all content-addressable gems to RubyGems
        run: |
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) && echo "$output" || {
              if echo "$output" | grep -qE "already pushed|Repushing"; then
                echo "Already published, skipping: $gem"
              else
                echo "$output" >&2; exit 1
              fi
            }
          done

  # Proves the safety net for real against the actual rubygems.org index: a stock client's plain
  # `gem install` must never see the prerelease, while an upgraded, --pre-requesting client must
  # get it and be able to actually run it.
  verify-published-ca:
    name: Verify published CA gem (${{ matrix.arch }})
    needs: [release-ca]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: A plain install must ignore the prerelease
        run: |
          for attempt in 1 2 3 4 5 6; do
            gem install pico_phone --no-document && break
            echo "Attempt $attempt failed; retrying in 60s"; sleep 60
          done
          installed="$(gem list '^pico_phone$')"
          echo "installed: $installed"
          if echo "$installed" | grep -q "pre"; then
            echo "ERROR: a plain install selected a prerelease" >&2
            exit 1
          fi
          echo "OK: plain install ignored the content-addressable prerelease"
      - name: An upgraded --pre client must get the content-addressable gem and run it
        run: |
          for attempt in 1 2 3 4 5 6; do
            gem update --system --no-document && \
            gem install pico_phone --pre --no-document && \
            ruby -e 'require "pico_phone"; raise "wrong version: #{PicoPhone::VERSION}" unless PicoPhone::VERSION.include?("pre.ca"); puts "OK: #{PicoPhone::VERSION}"; puts PicoPhone.parse("(510) 274-5556", "US").national' && \
            exit 0
            echo "Attempt $attempt failed; retrying in 60s"; sleep 60
          done
          echo "The published content-addressable gem failed verification -- see the log above." >&2
          exit 1
