name: Release (content-addressable, experimental)

# Manual-only: this publishes the content-addressable prerelease track (see the
# `content-addressable` branch) to rubygems.org as an opt-in --pre version. It is a separate
# workflow file (not jobs added to release.yml) because RubyGems' trusted-publishing credential
# step authorizes by (repo, workflow filename) -- rubygems.org needs its own Trusted Publisher
# entry registered for THIS filename before "Configure RubyGems credentials" below will work.
#
# Compile steps below are copied verbatim from release.yml (same cache keys, so this shares the
# vendored-deps cache with regular releases) -- only packaging (native:package_ca instead of
# native:package) and the smoke test (one gem per Ruby ABI, not one fat gem) differ.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-darwin-ca:
    name: Native gem (CA) — arm64-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install macOS build dependencies
        run: |
          brew update
          brew install boost icu4c@79
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-darwin-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.1)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.2)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.3)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.4)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Compile native extension (Ruby 4.0)
        run: bundle exec rake native:compile

      - name: Package content-addressable native gems (one per Ruby ABI)
        run: |
          gem update --system --no-document
          bundle exec rake native:package_ca

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.1'
      - name: Smoke-test the Ruby 3.1 content-addressable gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_file=$(for f in "$GITHUB_WORKSPACE"/pkg/pico_phone-*.gem; do gem specification "$f" required_ruby_version | grep -q 'version: 3.1.0' && echo "$f" && break; done)
          gem install rice -v '~> 4.3' --no-document
          gem install --local "$gem_file" --no-document
          ruby "$GITHUB_WORKSPACE/smoke_check.rb"
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.2'
      - name: Smoke-test the Ruby 3.2 content-addressable gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_file=$(for f in "$GITHUB_WORKSPACE"/pkg/pico_phone-*.gem; do gem specification "$f" required_ruby_version | grep -q 'version: 3.2.0' && echo "$f" && break; done)
          gem install rice -v '~> 4.3' --no-document
          gem install --local "$gem_file" --no-document
          ruby "$GITHUB_WORKSPACE/smoke_check.rb"
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.3'
      - name: Smoke-test the Ruby 3.3 content-addressable gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_file=$(for f in "$GITHUB_WORKSPACE"/pkg/pico_phone-*.gem; do gem specification "$f" required_ruby_version | grep -q 'version: 3.3.0' && echo "$f" && break; done)
          gem install rice -v '~> 4.3' --no-document
          gem install --local "$gem_file" --no-document
          ruby "$GITHUB_WORKSPACE/smoke_check.rb"
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.4'
      - name: Smoke-test the Ruby 3.4 content-addressable gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_file=$(for f in "$GITHUB_WORKSPACE"/pkg/pico_phone-*.gem; do gem specification "$f" required_ruby_version | grep -q 'version: 3.4.0' && echo "$f" && break; done)
          gem install rice -v '~> 4.3' --no-document
          gem install --local "$gem_file" --no-document
          ruby "$GITHUB_WORKSPACE/smoke_check.rb"
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '4.0'
      - name: Smoke-test the Ruby 4.0 content-addressable gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_file=$(for f in "$GITHUB_WORKSPACE"/pkg/pico_phone-*.gem; do gem specification "$f" required_ruby_version | grep -q 'version: 4.0.0' && echo "$f" && break; done)
          gem install rice -v '~> 4.3' --no-document
          gem install --local "$gem_file" --no-document
          ruby "$GITHUB_WORKSPACE/smoke_check.rb"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-ca-arm64-darwin
          path: pkg/pico_phone-*.gem

  build-native-linux-ca:
    name: Native gem (CA) — x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-linux-x86_64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - name: Compile native extension (Ruby 3.1)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.1-bookworm bash -c '
            set -e
            apt-get update -q
            apt-get install -y -q --no-install-recommends cmake
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" ext/pico_phone/vendor lib/pico_phone/3.1

      - name: Compile native extension (Ruby 3.2)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.2-bookworm bash -c '
            set -e
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.2

      - name: Compile native extension (Ruby 3.3)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.3-bookworm bash -c '
            set -e
            gem install bundler --no-document
