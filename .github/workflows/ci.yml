name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned (not ubuntu-latest): this job dynamically links the system libphonenumber-dev
        # package and uses ruby/setup-ruby's prebuilt binaries, both of which depend on the
        # runner's Ubuntu release. ubuntu-latest moving to 26.04 broke both -- no ruby-builder
        # release for 3.1.7 yet, and 26.04's libphonenumber-dev (8.13.51) classifies US numbers
        # differently than the spec expects. Revisit once both catch up.
        os: [ubuntu-24.04, macos-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libphonenumber-dev libicu-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libphonenumber protobuf abseil

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake
