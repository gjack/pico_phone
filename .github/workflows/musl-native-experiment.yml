name: Native gem (musl) — experimental

# Manual-trigger only. This validates aarch64-linux-musl / x86_64-linux-musl
# native builds (Alpine and similar) on real GitHub-hosted runners, separate
# from the tag-triggered release pipeline in release.yml. It does not publish
# anything and is not referenced by release.yml -- a failure here can't affect
# a real release. Once the approach is trusted, folding it into release.yml
# (and wiring its output gems into the `release` job's `needs:`) is a
# follow-up, deliberately not done here.

on:
  workflow_dispatch:

jobs:
  build-musl-deps:
    name: Build musl deps — ${{ matrix.arch }}-linux-musl
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ruby:3.3-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build toolchain
        run: apk add --no-cache build-base cmake bash curl tar git patch pkgconfig linux-headers python3
      - name: Build vendored dependencies (static ICU + abseil + protobuf + libphonenumber)
        run: bash ext/pico_phone/build_deps.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musl-vendor-install-${{ matrix.arch }}
          path: ext/pico_phone/vendor/install
          retention-days: 3

  test-musl:
    name: Test — ${{ matrix.arch }}-linux-musl / Ruby ${{ matrix.ruby }}
    needs: build-musl-deps
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ruby:${{ matrix.ruby }}-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build toolchain
        run: apk add --no-cache build-base bash linux-headers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: musl-vendor-install-${{ matrix.arch }}
          path: ext/pico_phone/vendor/install
      - name: Install gem dependencies
        run: |
          gem install bundler --no-document
          bundle config set --local path vendor/bundle
          bundle install
      - name: Compile native extension
        env:
          PICO_PHONE_NATIVE_BUILD: "1"
        run: bundle exec rake native:compile
      - name: Functional smoke check (parse + ICU-dependent geocoder fallback)
        run: |
          bundle exec ruby -e '
            require "pico_phone"
            n = PicoPhone.parse("+14155552671")
            raise "not valid" unless n.valid?
            raise "unexpected geo_name: #{n.geo_name.inspect}" unless n.geo_name == "San Francisco, CA"
            raise "ICU locale fallback broken: #{n.geo_name(%q(ja)).inspect}" unless n.geo_name("ja") == "アメリカ合衆国"
            puts "OK"
          '
      - name: Run spec suite
        run: bundle exec rspec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musl-binary-${{ matrix.arch }}-${{ matrix.ruby }}
          path: lib/pico_phone/${{ matrix.ruby }}/pico_phone.so
          retention-days: 3

  package-musl:
    name: Package fat gem — ${{ matrix.arch }}-linux-musl
    needs: test-musl
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ruby:3.3-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build toolchain
        run: apk add --no-cache build-base bash linux-headers
      - name: Install gem dependencies
        run: |
          gem install bundler --no-document
          bundle config set --local path vendor/bundle
          bundle install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: musl-binary-${{ matrix.arch }}-*
          path: lib/pico_phone
          merge-multiple: false
      - name: Flatten downloaded per-Ruby binaries into their ABI buckets
        run: |
          for d in lib/pico_phone/musl-binary-${{ matrix.arch }}-*; do
            abi="${d##*-}"
            mkdir -p "lib/pico_phone/$abi"
            mv "$d/pico_phone.so" "lib/pico_phone/$abi/pico_phone.so"
            rmdir "$d"
          done
          find lib/pico_phone -name pico_phone.so
      - name: Package fat native gem
        run: bundle exec rake native:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musl-gem-${{ matrix.arch }}
          path: pkg/*.gem
          retention-days: 7
