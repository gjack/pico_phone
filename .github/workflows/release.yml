name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native-darwin:
    name: Native gem — arm64-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install macOS build dependencies
        run: brew install boost icu4c@78
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-darwin-${{ hashFiles('ext/pico_phone/build_deps.sh') }}
      - name: Build native gem
        run: bundle exec rake native:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-arm64-darwin
          path: pkg/pico_phone-*.gem

  build-native-linux:
    name: Native gem — x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install system build dependencies
        run: sudo apt-get install -y cmake libicu-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-linux-x86_64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}
      - name: Build native gem
        run: bundle exec rake native:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-x86_64-linux
          path: pkg/pico_phone-*.gem

  build-native-linux-arm:
    name: Native gem — aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install system build dependencies
        run: sudo apt-get install -y cmake libicu-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-linux-aarch64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}
      - name: Build native gem
        run: bundle exec rake native:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-aarch64-linux
          path: pkg/pico_phone-*.gem

  release:
    name: Push to RubyGems
    needs: [build-native-darwin, build-native-linux, build-native-linux-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build source gem
        run: bundle exec rake build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg/
      - name: Push all gems to RubyGems
        run: |
          mkdir -p ~/.gem
          printf -- '---\n:rubygems_api_key: %s\n' "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) && echo "$output" || {
              if echo "$output" | grep -qE "already pushed|Repushing"; then
                echo "Already published, skipping: $gem"
              else
                echo "$output" >&2; exit 1
              fi
            }
          done
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
