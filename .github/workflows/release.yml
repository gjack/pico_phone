name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-darwin:
    name: Native gem — arm64-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install macOS build dependencies
        run: brew install boost icu4c@78
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-darwin-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.1)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.2)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.3)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.4)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Compile native extension (Ruby 4.0)
        run: bundle exec rake native:compile

      - name: Package fat native gem
        run: bundle exec rake native:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-arm64-darwin
          path: pkg/pico_phone-*.gem

  build-native-linux:
    name: Native gem — x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build dependencies
        run: sudo apt-get install -y cmake libicu-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-linux-x86_64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.1)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.2)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.3)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.4)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Compile native extension (Ruby 4.0)
        run: bundle exec rake native:compile

      - name: Package fat native gem
        run: bundle exec rake native:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-x86_64-linux
          path: pkg/pico_phone-*.gem

  build-native-linux-arm:
    name: Native gem — aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build dependencies
        run: sudo apt-get install -y cmake libicu-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-linux-aarch64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.1)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.2)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.3)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compile native extension (Ruby 3.4)
        run: bundle exec rake native:compile

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Compile native extension (Ruby 4.0)
        run: bundle exec rake native:compile

      - name: Package fat native gem
        run: bundle exec rake native:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-aarch64-linux
          path: pkg/pico_phone-*.gem

  # These two musl jobs deliberately don't use GitHub Actions' job-level `container:`
  # field, unlike how you might naively adapt the pattern above -- JavaScript-based
  # actions (checkout, cache, upload-artifact) aren't supported inside an Alpine
  # container on an ARM64 hosted runner, only on x64 ("JavaScript Actions in Alpine
  # containers are only supported on x64 Linux runners"). So both run on the bare
  # (glibc) runner and drive Alpine themselves via `docker run` with the workspace
  # bind-mounted in. The Alpine container runs as root, so anything it writes into
  # that bind mount is chown'd back to the runner's own user (GitHub-hosted Ubuntu
  # runners have passwordless sudo) before a host-side step needs to read it.
  build-native-musl-x86_64:
    name: Native gem — x86_64-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-musl-x86_64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - name: Compile native extension (Ruby 3.1)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.1-alpine sh -c '
            set -e
            apk add --no-cache build-base cmake bash curl tar patch pkgconfig linux-headers python3
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" ext/pico_phone/vendor lib/pico_phone/3.1

      - name: Compile native extension (Ruby 3.2)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.2-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.2

      - name: Compile native extension (Ruby 3.3)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.3-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.3

      - name: Compile native extension (Ruby 3.4)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.4-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.4

      - name: Compile native extension (Ruby 4.0)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:4.0-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/4.0

      - name: Package fat native gem
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.3-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            bundle exec rake native:package
          '
          sudo chown -R "$(id -u):$(id -g)" pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-x86_64-linux-musl
          path: pkg/pico_phone-*.gem

  build-native-musl-aarch64:
    name: Native gem — aarch64-linux-musl
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/pico_phone/vendor/install
          key: native-deps-musl-aarch64-${{ hashFiles('ext/pico_phone/build_deps.sh') }}

      - name: Compile native extension (Ruby 3.1)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.1-alpine sh -c '
            set -e
            apk add --no-cache build-base cmake bash curl tar patch pkgconfig linux-headers python3
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" ext/pico_phone/vendor lib/pico_phone/3.1

      - name: Compile native extension (Ruby 3.2)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.2-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.2

      - name: Compile native extension (Ruby 3.3)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.3-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.3

      - name: Compile native extension (Ruby 3.4)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.4-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/3.4

      - name: Compile native extension (Ruby 4.0)
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:4.0-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            export PICO_PHONE_NATIVE_BUILD=1
            bundle exec rake native:compile
          '
          sudo chown -R "$(id -u):$(id -g)" lib/pico_phone/4.0

      - name: Package fat native gem
        run: |
          docker run --rm -v "$PWD":/work -w /work ruby:3.3-alpine sh -c '
            set -e
            apk add --no-cache build-base bash linux-headers
            gem install bundler --no-document
            bundle config set --local path vendor/bundle
            bundle install
            bundle exec rake native:package
          '
          sudo chown -R "$(id -u):$(id -g)" pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-aarch64-linux-musl
          path: pkg/pico_phone-*.gem

  release:
    name: Push to RubyGems
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native-darwin, build-native-linux, build-native-linux-arm, build-native-musl-x86_64, build-native-musl-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build source gem
        run: bundle exec rake build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg/
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push all gems to RubyGems
        run: |
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) && echo "$output" || {
              if echo "$output" | grep -qE "already pushed|Repushing"; then
                echo "Already published, skipping: $gem"
              else
                echo "$output" >&2; exit 1
              fi
            }
          done
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
