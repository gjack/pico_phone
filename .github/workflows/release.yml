          sudo chown -R "$(id -u):$(id -g)" pkg
      - name: Smoke-test the packaged gem on bare Alpine images (no ICU, no compiler)
        run: |
          bash smoke_packaged_gem.sh pkg \
            ruby:3.1-alpine ruby:3.2-alpine ruby:3.3-alpine ruby:3.4-alpine ruby:4.0-alpine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-aarch64-linux-musl
          path: pkg/pico_phone-*.gem

  release:
    name: Push to RubyGems
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native-darwin, build-native-linux, build-native-linux-arm, build-native-musl-x86_64, build-native-musl-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build source gem
        run: bundle exec rake build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg/
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push all gems to RubyGems
        run: |
          for gem in pkg/*.gem; do
            output=$(gem push "$gem" 2>&1) && echo "$output" || {
              if echo "$output" | grep -qE "already pushed|Repushing"; then
                echo "Already published, skipping: $gem"
              else
                echo "$output" >&2; exit 1
              fi
            }
          done
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs only for real releases (tags), after the gems are on rubygems.org. Installs the
  # *published* gem on bare images the way users do -- `gem install` and Bundler choosing the
  # platform gem themselves -- and runs the same checks as the smoke tests above. If this
  # fails, the release is broken for some users: yank it (`gem yank pico_phone -v <version>
  # --platform <platform>`) and investigate. Runs on both architectures' runners.
  verify-published:
    name: Verify published gem (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the published gem on bare images and use it
        run: |
          version="${GITHUB_REF_NAME#v}"
          # rubygems.org can take a little while to start serving a just-pushed gem, so retry
          # before calling it a failure.
          for attempt in 1 2 3 4 5 6; do
            bash verify_install.sh --rubygems "$version" && exit 0
            echo "Attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          echo "The published gem failed verification -- see the log above." >&2
          exit 1
