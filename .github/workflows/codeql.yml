name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 4'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        if: matrix.language == 'cpp'
        run: sudo apt-get update -q && sudo apt-get install -y libphonenumber-dev libicu-dev

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'cpp' && 'manual' || 'none' }}
          config: |
            paths-ignore:
              - vendor/bundle

      - name: Build extension
        if: matrix.language == 'cpp'
        run: bundle exec rake compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
